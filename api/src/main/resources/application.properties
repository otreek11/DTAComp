spring.application.name=api
server.port=${PORT:8080}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Banco de dados (PostgreSQL). Em dev os defaults apontam para o container do compose.yaml.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/dtacomp}
spring.datasource.username=${DB_USERNAME:dtacomp}
spring.datasource.password=${DB_PASSWORD:dtacomp}

# O schema é criado/evoluído pelo Flyway (src/main/resources/db/migration);
# o Hibernate apenas valida se as entidades batem com as tabelas.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# JWT Configuration
jwt.secret=${JWT_SECRET:dtacomp-dev-secret-key-change-in-production-minimum-256-bits-long}
jwt.expiration=86400000
jwt.issuer=dtacomp-api

# CORS: origens do front autorizadas (separadas por vírgula; aceita padrões como https://*.vercel.app)
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000}

app.arquivos.prefixo-url=/arquivos/
app.storage.max-pdf-bytes=20971520
app.storage.max-image-size=5242880

# Armazenamento de arquivos: "local" (disco) ou "s3" (MinIO local / Cloudflare R2)
app.storage.tipo=${STORAGE_TIPO:local}
app.storage.root=${STORAGE_ROOT:./storage}
app.storage.s3.endpoint=${S3_ENDPOINT:http://localhost:9000}
app.storage.s3.region=${S3_REGION:auto}
app.storage.s3.bucket=${S3_BUCKET:dtacomp}
app.storage.s3.access-key=${S3_ACCESS_KEY:dtacomp}
app.storage.s3.secret-key=${S3_SECRET_KEY:dtacomp-minio-secret}
app.storage.s3.path-style=${S3_PATH_STYLE:true}
