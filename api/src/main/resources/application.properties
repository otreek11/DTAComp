spring.application.name=api
server.port=8080

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# JWT Configuration
jwt.secret=${JWT_SECRET:dtacomp-dev-secret-key-change-in-production-minimum-256-bits-long}
jwt.expiration=86400000
jwt.issuer=dtacomp-api


app.arquivos.prefixo-url=/arquivos/
app.storage.max-pdf-bytes=20971520
app.storage.root=${java.io.tmpdir}/dtacomp-test-storage
app.storage.max-image-size=5242880

spring.jpa.properties.hibernate.default_batch_fetch_size=50