# Perfil de produção (API no Render, banco no Supabase, arquivos no Cloudflare R2).
# Todas as variáveis abaixo são obrigatórias: sem default, a aplicação falha ao subir.

# Supabase (Session pooler, compatível com IPv4):
#   DB_URL=jdbc:postgresql://aws-0-<regiao>.pooler.supabase.com:5432/postgres?sslmode=require
#   DB_USERNAME=postgres.<project-ref>
# Se usar o Transaction pooler (porta 6543), acrescente &prepareThreshold=0 à URL.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5

spring.jpa.show-sql=false

jwt.secret=${JWT_SECRET}

# Ex.: https://dtacomp.vercel.app,https://dtacomp-*.vercel.app
app.cors.allowed-origins=${CORS_ORIGINS}

# Cloudflare R2: S3_ENDPOINT=https://<account-id>.r2.cloudflarestorage.com, S3_REGION=auto
app.storage.tipo=${STORAGE_TIPO:s3}
app.storage.s3.endpoint=${S3_ENDPOINT}
app.storage.s3.region=${S3_REGION:auto}
app.storage.s3.bucket=${S3_BUCKET}
app.storage.s3.access-key=${S3_ACCESS_KEY}
app.storage.s3.secret-key=${S3_SECRET_KEY}
app.storage.s3.path-style=${S3_PATH_STYLE:false}
