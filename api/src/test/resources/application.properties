# Testes rodam contra um PostgreSQL real via Testcontainers (requer Docker).
# A URL jdbc:tc: sobe o container automaticamente; o Flyway cria o schema.
spring.datasource.url=jdbc:tc:postgresql:17-alpine:///dtacomp_test
spring.datasource.username=test
spring.datasource.password=test

# Impede o @DataJpaTest de trocar o datasource por um banco embarcado
spring.test.database.replace=none

spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

app.cors.allowed-origins=http://localhost:3000
app.storage.tipo=local
app.storage.root=${java.io.tmpdir}/dtacomp-test-storage

# JWT Test Configuration
jwt.secret=test-secret-key-dtacomp-jwt-for-testing-only-minimum-256-bits
jwt.expiration=86400000
jwt.issuer=dtacomp-api-test
