# Blueprint do Render para a API (https://render.com/docs/blueprint-spec)
# Os valores com sync: false são pedidos no painel ao criar o serviço.
services:
  - type: web
    name: dtacomp-api
    runtime: docker
    rootDir: api
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /hello
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # Supabase (Session pooler): jdbc:postgresql://aws-0-<regiao>.pooler.supabase.com:5432/postgres?sslmode=require
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      # Domínio(s) do front no Vercel, separados por vírgula
      - key: CORS_ORIGINS
        sync: false
      # Cloudflare R2: https://<account-id>.r2.cloudflarestorage.com
      - key: S3_ENDPOINT
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
